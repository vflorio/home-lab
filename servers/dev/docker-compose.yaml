###########################################################################
# HomeLab Development Server
# IP: 192.168.1.193 (dev.intranet.vflorio.com)
###########################################################################

networks:
  dev:
    name: dev
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_SUBNET:?err}
          gateway: ${DOCKER_GATEWAY:?err}

volumes:
  # local disk on purpose: Postgres on NFS is unsafe (locking/corruption)
  postgresql-data:
    driver: local

services:
  ###########################################################################
  # Portainer - Docker Management
  ###########################################################################
  portainer-agent:
    container_name: portainer-agent
    image: "portainer/agent:2.33.2@sha256:a454c023f4b79ae308e372e5a4ab0d37961d6d8ad88fe5945544435203ded198"  # must match portainer-ce version on management
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_PORTAINER_AGENT:?err}:9001"
    environment:
      - AGENT_CLUSTER_ADDR="192.168.1.191"
    networks:
      - dev

  ###########################################################################
  # Traefik-KOP - Service Discovery Agent
  ###########################################################################
  traefik-kop:
    image: "ghcr.io/jittering/traefik-kop:0.18.1"
    container_name: traefik-kop
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - "REDIS_ADDR=${INTRANET_GATEWAY_IP:?err}:${PORT_VALKEY:?err}"
      - "REDIS_DB=${VALKEY_TRAEFIK_KOP:?err}"
      - "BIND_IP=${LOCAL_DOCKER_IP:?err}"
    networks:
      - dev

  ###########################################################################
  # Coder - Development Platform
  ###########################################################################
  coder:
    image: "ghcr.io/coder/coder:v2.27.0"
    container_name: coder
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_CODER:?err}:7080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PATH_DATA:?err}/coder/config:/home/coder/.config
      - ${PATH_DATA:?err}/coder/workspaces:/workspaces
      - ./templates:/templates
    group_add:
      - "${DOCKER_GROUP:-988}"
    user: "0:0"
    environment:
      - CODER_HTTP_ADDRESS=0.0.0.0:7080
      - CODER_ACCESS_URL=https://coder.${INTRANET_DOMAIN:?err}
      - CODER_WILDCARD_ACCESS_URL=*.coder.${INTRANET_DOMAIN:?err}
      - CODER_PG_CONNECTION_URL=postgres://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@postgres:5432/${CODER_DATABASE:?err}?sslmode=disable
      # Login via Authentik (provider in servers/gateway/authentik/blueprints/dev-oidc.yaml)
      - CODER_OIDC_ISSUER_URL=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/coder/
      - CODER_OIDC_CLIENT_ID=coder
      - CODER_OIDC_CLIENT_SECRET=${CODER_OIDC_CLIENT_SECRET:?err}
      - CODER_OIDC_SIGN_IN_TEXT=Accedi con Authentik
      - CODER_OIDC_ICON_URL=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/static/dist/assets/icons/icon.svg
      - CODER_OIDC_IGNORE_EMAIL_VERIFIED=true  # Authentik does not always send email_verified
      - CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE=false  # hide the built-in "Login with GitHub"
      - TZ=${TIMEZONE:?err}
    env_file:
      # Gitea external auth: needs an OAuth app created in Gitea first, so it is optional (see README)
      - path: ./coder-external-auth.env
        required: false
    depends_on:
      - postgres
    labels:
      - traefik.enable=true
      - traefik.http.routers.coder.service=coder
      - traefik.http.routers.coder.entrypoints=websecure
      - traefik.http.routers.coder.rule=Host(`coder.${INTRANET_DOMAIN:?err}`) || HostRegexp(`^[a-zA-Z0-9-]+\.coder\.${INTRANET_DOMAIN:?err}$$`)
      # no authentik-forwardauth: workspace agents and the CLI can't pass it, Coder logs in via OIDC
      - traefik.http.services.coder.loadbalancer.server.scheme=http
      - traefik.http.services.coder.loadbalancer.server.port=${PORT_CODER:?err}
    networks:
      - dev

  ###########################################################################
  # PostgreSQL - Database for Coder
  ###########################################################################
  postgres:
    image: "postgres:18-alpine"  # major upgrades only via dump/restore
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgresql-data:/var/lib/postgresql  # postgres 18+ keeps data in /var/lib/postgresql/18/docker
      - ./postgres-init:/docker-entrypoint-initdb.d:ro  # creates the extra databases on first init
    environment:
      - POSTGRES_DB=${CODER_DATABASE:?err}
      - GITEA_DATABASE=${GITEA_DATABASE:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - TZ=${TIMEZONE:?err}
    networks:
      - dev

  ###########################################################################
  # Gitea - Git Repository Server
  ###########################################################################
  gitea:
    image: "gitea/gitea:1.24.6"
    container_name: gitea
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_GITEA:?err}:3000"
      - "${LOCAL_DOCKER_IP:?err}:${PORT_GITEA_SSH:?err}:22"
    volumes:
      - ${PATH_DATA:?err}/gitea:/data
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${GITEA_DATABASE:?err}
      - GITEA__database__USER=${POSTGRES_USER:?err}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:?err}
      - GITEA__server__DOMAIN=git.${INTRANET_DOMAIN:?err}
      - GITEA__server__SSH_DOMAIN=${INTRANET_DOMAIN:?err}  # ssh goes straight to the dev VM, not through Traefik
      - GITEA__server__SSH_PORT=${PORT_GITEA_SSH:?err}
      - GITEA__server__ROOT_URL=https://git.${INTRANET_DOMAIN:?err}/
      # Accounts come from Authentik (auth source created once via CLI, see README)
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION=true
      - GITEA__service__SHOW_REGISTRATION_BUTTON=false
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      - GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      - GITEA__oauth2_client__USERNAME=nickname  # Authentik username
      - GITEA__oauth2_client__ACCOUNT_LINKING=auto  # same email links to the existing local account
    depends_on:
      - postgres
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitea.service=gitea
      - traefik.http.routers.gitea.entrypoints=websecure
      - traefik.http.routers.gitea.rule=Host(`git.${INTRANET_DOMAIN:?err}`)
      # no authentik-forwardauth: git over https and Coder's OAuth calls can't pass it, Gitea logs in via OIDC
      - traefik.http.services.gitea.loadbalancer.server.scheme=http
      - traefik.http.services.gitea.loadbalancer.server.port=${PORT_GITEA:?err}
    networks:
      - dev

  ###########################################################################
  # Container Registry - Docker Registry
  ###########################################################################
  registry:
    image: "registry:2.8.3"
    container_name: container-registry
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_REGISTRY:?err}:5000"
    volumes:
      - ${PATH_DATA:?err}/container-registry:/var/lib/registry/docker
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
      - REGISTRY_AUTH_HTPASSWD_PATH=/var/lib/registry/auth/htpasswd
    labels:
      - traefik.enable=true
      - traefik.http.routers.registry.service=registry
      - traefik.http.routers.registry.entrypoints=websecure
      - traefik.http.routers.registry.rule=Host(`container-registry.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.registry.middlewares=authentik-forwardauth@file
      - traefik.http.services.registry.loadbalancer.server.scheme=http
      - traefik.http.services.registry.loadbalancer.server.port=${PORT_REGISTRY:?err}
    networks:
      - dev

  ###########################################################################
  # Verdaccio - NPM Registry
  ###########################################################################
  verdaccio:
    image: "verdaccio/verdaccio:6.2.0"
    container_name: verdaccio
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_VERDACCIO:?err}:${PORT_VERDACCIO:?err}"
    volumes:
      - ${PATH_DATA:?err}/verdaccio/storage:/verdaccio/storage  # the image declares it as VOLUME: without this bind packages end up in an anonymous volume
      - "./verdaccio:/verdaccio/conf"
    environment:
      - VERDACCIO_USER_NAME=${VERDACCIO_USER:?err}
      - VERDACCIO_USER_PWD=${VERDACCIO_PASSWORD:?err}
      - VERDACCIO_PORT=${PORT_VERDACCIO:?err}
    labels:
      - traefik.enable=true
      - traefik.http.routers.verdaccio.service=verdaccio
      - traefik.http.routers.verdaccio.entrypoints=websecure
      - traefik.http.routers.verdaccio.rule=Host(`npm.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.verdaccio.middlewares=authentik-forwardauth@file
      - traefik.http.services.verdaccio.loadbalancer.server.scheme=http
      - traefik.http.services.verdaccio.loadbalancer.server.port=${PORT_VERDACCIO:?err}
    networks:
      - dev

  ###########################################################################
  # Excalidraw - Quick Sketching
  ###########################################################################
  excalidraw:
    image: "excalidraw/excalidraw:latest@sha256:b5b9454af5f9c4403ea3b8ef06f2a3e29ac68e79e7d457f373f4d4a4b603d4bc"  # no versioned tags
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_EXCALIDRAW:?err}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.excalidraw.service=excalidraw
      - traefik.http.routers.excalidraw.entrypoints=websecure
      - traefik.http.routers.excalidraw.rule=Host(`excalidraw.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.excalidraw.middlewares=authentik-forwardauth@file
      - traefik.http.services.excalidraw.loadbalancer.server.scheme=http
      - traefik.http.services.excalidraw.loadbalancer.server.port=${PORT_EXCALIDRAW}
    networks:
      - dev

  ###########################################################################
  # Drawio - Detailed Diagrams
  ###########################################################################
  drawio:
    image: "jgraph/drawio:32.6.9"
    container_name: drawio
    restart: unless-stopped
    ports:
      - "${LOCAL_DOCKER_IP:?err}:${PORT_DRAWIO:?err}:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.drawio.service=drawio
      - traefik.http.routers.drawio.entrypoints=websecure
      - traefik.http.routers.drawio.rule=Host(`drawio.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.drawio.middlewares=authentik-forwardauth@file
      - traefik.http.services.drawio.loadbalancer.server.scheme=http
      - traefik.http.services.drawio.loadbalancer.server.port=${PORT_DRAWIO}
    networks:
      - dev
