# Provisioned at startup; the dashboards in ../../dashboards refer to it by uid
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s  # = scrape_interval, so $__rate_interval is never too short
