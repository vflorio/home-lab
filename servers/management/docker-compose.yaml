###########################################################################
# HomeLab Management Server
# Monitoring, Management, Database, Remote Access
# IP: 192.168.1.191 (management.intranet.vflorio.com)
###########################################################################

networks:
  management:
    name: management
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: ${DOCKER_SUBNET:?err}
        gateway: ${DOCKER_GATEWAY:?err}

volumes:
  # local disk on purpose: Postgres on NFS is unsafe (locking/corruption)
  postgresql-data:
    driver: local
  # same reason: Prometheus' TSDB does not support NFS
  prometheus-data:
    driver: local

services:

  ###########################################################################
  # Guacamole / Guacd - Remote Desktop Gateway
  ###########################################################################
  guacamole:
    image: guacamole/guacamole:1.6.0@sha256:9e99fa50b7939c3a296c4b0809fe3e52cfecbf010318b439160295a407910423  # keep in sync with guacd
    container_name: guacamole
    restart: unless-stopped
    #user: ${PUID:?err}:${PGID:?err}
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    networks:
      - management
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_GUACAMOLE:?err}:8080
    environment:
      - TZ=${TIMEZONE:?err}
      - WEBAPP_CONTEXT=ROOT
      - GUACD_HOSTNAME=guacd
      - POSTGRESQL_HOSTNAME=postgresql
      - POSTGRESQL_PORT=${PORT_POSTGRES:?err}
      - POSTGRESQL_DATABASE=${GUACAMOLE_DATABASE:?err}
      - POSTGRESQL_USER=${POSTGRES_USER:?err}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRESQL_AUTO_CREATE_ACCOUNTS=true  # Authentik users get a DB entry, so permissions can be granted to them
      # Login via Authentik (provider in servers/gateway/authentik/blueprints/management-oidc.yaml)
      - OPENID_ENABLED=true
      - OPENID_AUTHORIZATION_ENDPOINT=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/authorize/
      - OPENID_JWKS_ENDPOINT=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/guacamole/jwks/
      - OPENID_ISSUER=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/guacamole/
      - OPENID_CLIENT_ID=guacamole
      - OPENID_REDIRECT_URI=https://guacamole.${INTRANET_DOMAIN:?err}/
      - OPENID_USERNAME_CLAIM_TYPE=preferred_username  # Authentik username, not the email
      - EXTENSION_PRIORITY=*, openid  # keep the local login form (guacadmin) with an SSO link
    labels:
      - traefik.enable=true
      - traefik.http.routers.guacamole.service=guacamole
      - traefik.http.routers.guacamole.rule=Host(`guacamole.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.guacamole.entrypoints=websecure
      # no authentik-forwardauth: Guacamole logs in via OIDC
      - traefik.http.services.guacamole.loadbalancer.server.scheme=http
      - traefik.http.services.guacamole.loadbalancer.server.port=${PORT_GUACAMOLE:?err}

  ###########################################################################
  # Guacd - Guacamole Daemon
  ###########################################################################
  guacd:
    image: guacamole/guacd:1.6.0@sha256:ed8a1835845add72b358a5aa913da1309604a0222b47bea6f3786afae1289e35  # keep in sync with guacamole
    container_name: guacd
    restart: unless-stopped
    #user: ${PUID:?err}:${PGID:?err}
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    networks:
      - management
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_GUACD:?err}:4822
    environment:
      - TZ=${TIMEZONE:?err}
      - POSTGRESQL_HOSTNAME=postgresql
      - POSTGRESQL_PORT=${PORT_POSTGRES:?err}
      - POSTGRESQL_DATABASE=${GUACAMOLE_DATABASE:?err}
      - POSTGRESQL_USER=${POSTGRES_USER:?err}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:?err}

  ###########################################################################
  # Prometheus - Metrics Collection & Monitoring
  ###########################################################################
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    restart: unless-stopped
    #user: ${PUID:?err}:${PGID:?err}
    networks:
      - management
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_PROMETHEUS:?err}:9090  # traefik-kop routes to LOCAL_DOCKER_IP
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:?err}
      - --web.enable-lifecycle  # reload after editing the config: curl -X POST http://192.168.1.191:9090/-/reload
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus:/etc/prometheus:ro  # folder, not file: rsync replaces files, a file mount would keep the old one
    environment:
      - TZ=${TIMEZONE:?err}
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.service=prometheus
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.middlewares=authentik-forwardauth@file
      - traefik.http.services.prometheus.loadbalancer.server.scheme=http
      - traefik.http.services.prometheus.loadbalancer.server.port=${PORT_PROMETHEUS:?err}

  ###########################################################################
  # Blackbox Exporter - HTTPS probes of every app through Traefik (up/down, latency, TLS expiry)
  # Only reachable from Prometheus on the management network
  ###########################################################################
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: blackbox-exporter
    restart: unless-stopped
    networks:
      - management
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./prometheus:/etc/blackbox:ro  # folder mount, see prometheus

  ###########################################################################
  # Grafana - Visual Monitoring Dashboard
  ###########################################################################
  grafana:
    image: grafana/grafana-enterprise:12.2.0
    container_name: grafana
    restart: unless-stopped
    #user: ${PUID:?err}:${PGID:?err}
    networks:
      - management
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_GRAFANA:?err}:3000
    volumes:
      - /var/log:/var/dockerhost:ro
      - ${PATH_DATA:?err}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro  # Prometheus datasource + dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - TZ=${TIMEZONE:?err}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/homelab.json
      - GF_SERVER_ROOT_URL=https://grafana.${INTRANET_DOMAIN:?err}
      # Login via Authentik (provider in servers/gateway/authentik/blueprints/management-oidc.yaml)
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:?err}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'authentik Admins') && 'Admin' || 'Viewer'
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/grafana/end-session/
      - GF_AUTH_OAUTH_AUTO_LOGIN=true  # local admin still works from /login?disableAutoLogin
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.routers.grafana.rule=Host(`grafana.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      # no authentik-forwardauth: Grafana logs in via OIDC
      - traefik.http.services.grafana.loadbalancer.server.scheme=http 
      - traefik.http.services.grafana.loadbalancer.server.port=${PORT_GRAFANA:?err}

  ###########################################################################
  # Portainer - Container Management
  ###########################################################################
  portainer:
    image: portainer/portainer-ce:2.33.2  # keep portainer/agent on all servers in sync
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PATH_DATA:?err}/portainer:/data
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_PORTAINER:?err}:9000
    networks:
      - management
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.service=portainer
      - traefik.http.routers.portainer.rule=Host(`portainer.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      # no authentik-forwardauth: Portainer logs in via OIDC (configured in its UI, see README)
      - traefik.http.services.portainer.loadbalancer.server.scheme=http
      - traefik.http.services.portainer.loadbalancer.server.port=${PORT_PORTAINER:?err}
  
  ###########################################################################
  # Homepage - Docker Container Dashboard
  ###########################################################################
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.5.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_HOMEPAGE:?err}:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./homepage:/app/config
    environment:
      #- UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - HOMEPAGE_ALLOWED_HOSTS=home.${INTRANET_DOMAIN:?err},${INTRANET_DOMAIN:?err}:${PORT_HOMEPAGE:?err}
    networks:
      - management
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.service=homepage
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.rule=Host(`home.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.homepage.middlewares=authentik-forwardauth@file
      - traefik.http.services.homepage.loadbalancer.server.scheme=http
      - traefik.http.services.homepage.loadbalancer.server.port=${PORT_HOMEPAGE:?err}

  ###########################################################################
  # Semaphore - Ansible Web UI / Frontend
  ###########################################################################
  semaphore:
    image: semaphoreui/semaphore:v2.19.17
    container_name: semaphore
    restart: unless-stopped
    #user: ${PUID:?err}:${PGID:?err}
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    networks:
      - management
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_SEMAPHORE:?err}:${PORT_SEMAPHORE:?err}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT_SEMAPHORE:?err}/api/ping"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PATH_DATA:?err}/semaphore/config:/etc/semaphore:rw
      - ${PATH_DATA:?err}/semaphore/tmp:/tmp/semaphore:rw
      # - ${PATH_DATA:?err}/ansible:/ansible:ro # FIXME Mount ansible playbooks
      # - ${PATH_DATA:?err}/ssh:/root/.ssh:ro   # FIXME SSH keys for remote access
    environment:
      - TZ=${TIMEZONE:?err}
      # Database configuration (PostgreSQL)
      - SEMAPHORE_DB_DIALECT=postgres
      - SEMAPHORE_DB_HOST=postgresql
      - SEMAPHORE_DB_NAME=${SEMAPHORE_DATABASE:?err}
      - SEMAPHORE_DB_PORT=${PORT_POSTGRES:?err}
      - SEMAPHORE_DB_USER=${POSTGRES_USER:?err}
      - SEMAPHORE_DB_PASS=${POSTGRES_PASSWORD:?err}
      # Admin user
      - SEMAPHORE_ADMIN_NAME=${SEMAPHORE_ADMIN_USER:?err}
      - SEMAPHORE_ADMIN_EMAIL=${SEMAPHORE_ADMIN_EMAIL:?err}
      - SEMAPHORE_ADMIN_PASSWORD=${SEMAPHORE_ADMIN_PASSWORD:?err}
      - SEMAPHORE_ADMIN=${SEMAPHORE_ADMIN_USER:?err}
      # Access configuration
      - SEMAPHORE_ACCESS_KEY_ENCRYPTION=${SEMAPHORE_ACCESS_KEY:?err}
      # Web configuration
      - SEMAPHORE_WEB_HOST=0.0.0.0
      - SEMAPHORE_PORT=${PORT_SEMAPHORE:?err}
      # Features
      - SEMAPHORE_LDAP_ENABLE=false
      - SEMAPHORE_DEMO_MODE=false
      # Login via Authentik (provider in servers/gateway/authentik/blueprints/management-oidc.yaml).
      # The "authentik" key is part of the redirect URL registered in the provider
      - 'SEMAPHORE_OIDC_PROVIDERS={"authentik": {"display_name": "Accedi con Authentik", "provider_url": "https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/semaphore/", "client_id": "semaphore", "client_secret": "${SEMAPHORE_OIDC_CLIENT_SECRET:?err}", "redirect_url": "https://semaphore.${INTRANET_DOMAIN:?err}/api/auth/oidc/authentik/redirect/", "scopes": ["openid", "profile", "email"], "username_claim": "preferred_username", "name_claim": "name", "email_claim": "email"}}'
    labels:
      - traefik.enable=true
      - traefik.http.routers.semaphore.service=semaphore
      - traefik.http.routers.semaphore.rule=Host(`semaphore.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.semaphore.entrypoints=websecure
      # no authentik-forwardauth: Semaphore logs in via OIDC
      - traefik.http.services.semaphore.loadbalancer.server.scheme=http
      - traefik.http.services.semaphore.loadbalancer.server.port=${PORT_SEMAPHORE:?err}

  ###########################################################################
  # Vaultwarden - Password Manager (Bitwarden compatible)
  ###########################################################################
  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    networks:
      - management
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_VAULTWARDEN:?err}:80
    volumes:
      - ${PATH_DATA:?err}/vaultwarden:/data  # attachments, sends, rsa keys (vault itself is in postgres)
    environment:
      - TZ=${TIMEZONE:?err}
      - DOMAIN=https://vaultwarden.${INTRANET_DOMAIN:?err}
      - DATABASE_URL=postgresql://${VAULTWARDEN_DB_USER:?err}:${VAULTWARDEN_DB_PASSWORD:?err}@postgresql:${PORT_POSTGRES:?err}/${VAULTWARDEN_DATABASE:?err}  # DB/role created by setup-vaultwarden.sh
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:?err}  # argon2 hash, admin panel at /admin
      - SIGNUPS_ALLOWED=false  # new accounts only via invite from /admin
      - INVITATIONS_ALLOWED=true
      - SHOW_PASSWORD_HINT=false
      # SSO via Authentik (provider in servers/gateway/authentik/blueprints/management-oidc.yaml).
      # It replaces the email+password step only: the vault is still unlocked with the master password
      - SSO_ENABLED=true
      - SSO_ONLY=false  # password login stays as fallback (and for clients without SSO)
      - SSO_AUTHORITY=https://auth.${GATEWAY_INTRANET_DOMAIN:?err}/application/o/vaultwarden/
      - SSO_CLIENT_ID=vaultwarden
      - SSO_CLIENT_SECRET=${VAULTWARDEN_OIDC_CLIENT_SECRET:?err}
      - SSO_SCOPES=email profile offline_access
      - SSO_SIGNUPS_MATCH_EMAIL=true  # first SSO login links the existing account with the same email
      - SSO_CLIENT_CACHE_EXPIRATION=0
    labels:
      # no authentik-forwardauth: Bitwarden apps/extensions can't pass it, Vaultwarden has its own login
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.service=vaultwarden
      - traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${INTRANET_DOMAIN:?err}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.services.vaultwarden.loadbalancer.server.scheme=http
      - traefik.http.services.vaultwarden.loadbalancer.server.port=${PORT_VAULTWARDEN:?err}

  ###########################################################################
  # PostgreSQL - Shared Database
  ###########################################################################
  postgresql:
    image: docker.io/library/postgres:18  # major upgrades only via dump/restore
    container_name: postgresql
    restart: unless-stopped
    networks:
      - management
    # user: ${PUID:?err}:${PGID:?err}  # FIXME
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_POSTGRES:?err}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${SEMAPHORE_DATABASE}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - postgresql-data:/var/lib/postgresql  # postgres 18+ keeps data in /var/lib/postgresql/18/docker
    environment:
      - TZ=${TIMEZONE:?err}
      - POSTGRES_DB=${SEMAPHORE_DATABASE:?err}  # guacamole DB is created by setup_guacamole.sh
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}

  ###########################################################################
  # Traefik-KOP - Service Discovery Agent
  ###########################################################################
  traefik-kop:
    image: "ghcr.io/jittering/traefik-kop:0.17@sha256:af5e720209798c746051aaa5313115bce185512c0f85b0ff4abe51dd76b3aabd"
    container_name: traefik-kop
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - "REDIS_ADDR=${INTRANET_GATEWAY_IP:?err}:${PORT_VALKEY:?err}"
      - "REDIS_DB=${VALKEY_TRAEFIK_KOP:?err}"
      - "BIND_IP=${LOCAL_DOCKER_IP:?err}"
    networks:
      - management

  ###########################################################################
  # Node Exporter - Host Metrics (CPU, RAM, disks, network), scraped by Prometheus on management
  # Host network so interface counters are the VM's, not the container's
  ###########################################################################
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${LOCAL_DOCKER_IP:?err}:${PORT_NODE_EXPORTER:?err}
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave  # rslave: NFS shares mounted after start show up too

  ###########################################################################
  # cAdvisor - Per-container Metrics, scraped by Prometheus on management
  ###########################################################################
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    ports:
      - ${LOCAL_DOCKER_IP:?err}:${PORT_CADVISOR:?err}:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - management
