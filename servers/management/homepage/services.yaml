---
# Homepage services
# https://gethomepage.dev/configs/services/
#
# Description convention (rendered as link chips by custom.js):
#   "<descrizione> │ 🌐 <host pubblico> │ 🏠 <host intranet> │ 🔌 <ip:porta> │ 🔒 <solo testo>"
#   🌐 / 🏠 -> https://   🔌 -> http://   (a token with an explicit scheme is used as-is)
#   🔒 -> not a link (TCP ports, internal endpoints): click copies it
#
# href is the public URL when the app is on Cloudflare (dns/cloudflare/dns.tf),
# otherwise the intranet one. siteMonitor always hits ip:port, bypassing Traefik/Authentik.

