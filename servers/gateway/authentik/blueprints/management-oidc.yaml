# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# OIDC providers for the management server apps that have their own login
# (Grafana, Portainer, Semaphore, Guacamole, Vaultwarden). Their routers drop
# authentik-forwardauth@file, the apps redirect to Authentik themselves
#
# MANAGEMENT_INTRANET_DOMAIN and the client secrets come from the compose environment, the
# secrets must match the ones in servers/management/.env (Portainer's is pasted in its UI)

version: 1
metadata:
  name: Homelab - management OIDC
  labels:
    blueprints.goauthentik.io/description: "OIDC providers for Grafana, Portainer, Semaphore, Guacamole and Vaultwarden"

entries:
  ###########################################################################
  # Grafana - roles from the "groups" claim (see GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH)
  ###########################################################################
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://grafana.%s/login/generic_oauth", !Env MANAGEMENT_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: !Format ["https://grafana.%s", !Env MANAGEMENT_INTRANET_DOMAIN]

  ###########################################################################
  # Portainer - OAuth is set in its UI (Settings > Authentication), see servers/management/README
  ###########################################################################
  - model: authentik_providers_oauth2.oauth2provider
    id: portainer-provider
    identifiers:
      name: Portainer
    attrs:
      client_type: confidential
      client_id: portainer
      client_secret: !Env PORTAINER_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        # Portainer sends its root URL, trailing slash included
        - matching_mode: strict
          url: !Format ["https://portainer.%s/", !Env MANAGEMENT_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: portainer
    attrs:
      name: Portainer
      provider: !KeyOf portainer-provider
      meta_launch_url: !Format ["https://portainer.%s", !Env MANAGEMENT_INTRANET_DOMAIN]

  ###########################################################################
  # Semaphore
  ###########################################################################
  - model: authentik_providers_oauth2.oauth2provider
    id: semaphore-provider
    identifiers:
      name: Semaphore
    attrs:
      client_type: confidential
      client_id: semaphore
      client_secret: !Env SEMAPHORE_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        # "authentik" is the key of SEMAPHORE_OIDC_PROVIDERS in servers/management/docker-compose.yaml
        - matching_mode: strict
          url: !Format ["https://semaphore.%s/api/auth/oidc/authentik/redirect/", !Env MANAGEMENT_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: semaphore
    attrs:
      name: Semaphore
      provider: !KeyOf semaphore-provider
      meta_launch_url: !Format ["https://semaphore.%s", !Env MANAGEMENT_INTRANET_DOMAIN]

  ###########################################################################
  # Guacamole - implicit flow (id_token only), so no client secret is configured on its side.
  # Guacamole refuses tokens valid for more than 300 minutes: keep the default validity
  ###########################################################################
  - model: authentik_providers_oauth2.oauth2provider
    id: guacamole-provider
    identifiers:
      name: Guacamole
    attrs:
      client_type: confidential
      client_id: guacamole
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://guacamole.%s/", !Env MANAGEMENT_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: guacamole
    attrs:
      name: Guacamole
      provider: !KeyOf guacamole-provider
      meta_launch_url: !Format ["https://guacamole.%s", !Env MANAGEMENT_INTRANET_DOMAIN]

  ###########################################################################
  # Vaultwarden - SSO only proves who the user is, the vault is still unlocked with the
  # master password. It needs email_verified=true (newer Authentik sends false by default)
  # and offline_access for the refresh tokens
  ###########################################################################
  - model: authentik_providers_oauth2.scopemapping
    id: vaultwarden-email-scope
    identifiers:
      name: Vaultwarden Email Scope
    attrs:
      scope_name: email
      description: Email address (always verified)
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: vaultwarden-provider
    identifiers:
      name: Vaultwarden
    attrs:
      client_type: confidential
      client_id: vaultwarden
      client_secret: !Env VAULTWARDEN_OIDC_CLIENT_SECRET
      access_token_validity: hours=1  # Vaultwarden wants more than 5 minutes
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://vaultwarden.%s/identity/connect/oidc-signin", !Env MANAGEMENT_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf vaultwarden-email-scope
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: vaultwarden
    attrs:
      name: Vaultwarden
      provider: !KeyOf vaultwarden-provider
      meta_launch_url: !Format ["https://vaultwarden.%s", !Env MANAGEMENT_INTRANET_DOMAIN]
