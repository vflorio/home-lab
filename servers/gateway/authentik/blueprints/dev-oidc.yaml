# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# OIDC providers for the dev server apps that have their own login (Coder, Gitea).
# They must NOT sit behind authentik-forwardauth@file: their CLIs, git and the Coder
# workspace agents call them without a browser session and would get redirected to the login
#
# DEV_INTRANET_DOMAIN and the client secrets come from the compose environment, the secrets
# must match the ones in servers/dev/.env

version: 1
metadata:
  name: Homelab - dev OIDC
  labels:
    blueprints.goauthentik.io/description: "OIDC providers for Coder and Gitea"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: coder-provider
    identifiers:
      name: Coder
    attrs:
      client_type: confidential
      client_id: coder
      client_secret: !Env CODER_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://coder.%s/api/v2/users/oidc/callback", !Env DEV_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: coder
    attrs:
      name: Coder
      provider: !KeyOf coder-provider
      meta_launch_url: !Format ["https://coder.%s", !Env DEV_INTRANET_DOMAIN]

  - model: authentik_providers_oauth2.oauth2provider
    id: gitea-provider
    identifiers:
      name: Gitea
    attrs:
      client_type: confidential
      client_id: gitea
      client_secret: !Env GITEA_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        # "authentik" is the auth source name created in Gitea (see servers/dev/README)
        - matching_mode: strict
          url: !Format ["https://git.%s/user/oauth2/authentik/callback", !Env DEV_INTRANET_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: gitea
    attrs:
      name: Gitea
      provider: !KeyOf gitea-provider
      meta_launch_url: !Format ["https://git.%s", !Env DEV_INTRANET_DOMAIN]
